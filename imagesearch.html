<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Imagens do Google</title>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    </head>
    <body>
        <div>
            <ul class="othersearch">
                <li class="searches"><a href="index.html">Return</a></li>
            </ul>
        </div>
        <div class="white-space">
        </div>
        <div class="centerdiv">
            <div class="logo-container">
                <img class="imageG" src="https://images.google.com/images/branding/google_wordmark/v1/1x/googlelogo_color_272x92dp.png" alt="Google" height="92">
                <span class="googleimage">Imagens</span>
            </div>
        </div>
        <form action="https://www.google.com/images">
            <div class="roundedinput">
                <input type="text" name="q" class="searchbox">
            </div>
            <div class="centerdiv">
                <input type="submit" value="Pesquisa Google" class="inputbutton">
            </div>
        </form>
    </body>
</html>
