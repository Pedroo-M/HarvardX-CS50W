{% extends "auctions/layout.html" %}

{% block body %}
    <h1>Create a Auction</h1>

    <form action="{% url 'create' %}" method="post">
        {% csrf_token %}
        <li>
            <input type="text" name="title" placeholder="Title" style="padding: 10px; border-radius: 4px; margin: 5px;">
            <input type="text" name="description" placeholder="Description" style="padding: 10px; border-radius: 4px; margin: 5px;">
        </li>
        <li>
            <input type="number" step="0.01" name="initial_value" placeholder="initial_value" style="padding: 10px; border-radius: 4px; margin: 5px;">
            <input type="url" name="image" placeholder="Url Image" style="padding: 10px; border-radius: 4px; margin: 5px;">
            <input type="text" name="category" placeholder="category" style="padding: 10px; border-radius: 4px; margin: 5px;">
            </li>
        <input type="submit" value="Submit" style="background-color: rgb(0, 132, 255); 
            color: white; border-radius: 4px; border: none; margin-bottom: 30px; padding: 4px;  margin: 5px; padding: 10px;">
    </form>
{% endblock %}
