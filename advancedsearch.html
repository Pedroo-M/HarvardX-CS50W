<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Pesquisa avançada do Google</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="advancedgoogle">
            <div class="googletop"></div>
            <div class="logo-container">
                <img class="imageAdvanced" src="https://images.google.com/images/branding/google_wordmark/v1/1x/googlelogo_color_272x92dp.png" alt="Google" width="92" height="30">
            </div>
            <div class="returnad">
                <ul class="othersearch">
                    <li class="searches"><a href="index.html">Return</a></li>
                </ul>
            </div>
        </div>
        <div class="divcentral">
            <form action="https://www.google.com/search">
                <h1 class="peav">Pesquisa Avançada</h1>
                <h2 class="pepa">Localizar páginas com</h2>
                <div class="op1">
                    <label for="inop1" class="label1">Todas essas palavras:</label>
                    <input type="text" id="inop1" class="inop1" name="as_q">
                </div>
                <div class="op1">
                    <label for="inop2" class="label1">Esta expressão ou frase exata:</label>
                    <input type="text" id="inop2" class="inop2" name="as_epq">
                </div>
                <div class="op1">
                    <label for="inop3" class="label1">Nenhuma destas palavras:</label>
                    <input type="text" id="inop3" class="inop3" name="as_eq">
                </div>
                <div class="op1">
                    <label for="inop4" class="label1">Site ou domínio:</label>
                    <input type="text" id="inop4" class="inop4" name="as_sitesearch">
                </div>
                <div class="bluebutton">
                    <input type="submit" class="submitadv" value="Pesquisa avançada">
                </div>
            </form>
        </div>
    </body>
</html>
